<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VANTA — магазин одежды</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0d0d0d;--mu:#6b6b6b;--ln:#e4e4e4;--sf:#f3f3f2;--ac:#0d0d0d;--ac-t:#fff;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0d;--fg:#f4f4f4;--mu:#a0a0a0;--ln:#2a2a2a;--sf:#1a1a1a;--ac:#f4f4f4;--ac-t:#0d0d0d;--err:#ff8a80}}
:root[data-theme=dark]{--bg:#0d0d0d;--fg:#f4f4f4;--mu:#a0a0a0;--ln:#2a2a2a;--sf:#1a1a1a;--ac:#f4f4f4;--ac-t:#0d0d0d;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 Archivo,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.w{max-width:1200px;margin:0 auto;padding:0 20px}
.bar{background:var(--ac);color:var(--ac-t);text-align:center;font-size:13px;padding:8px 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);z-index:20}
.hd{display:flex;align-items:center;gap:14px;height:60px}
.logo{font-weight:900;font-size:24px;letter-spacing:.18em;text-decoration:none;border:0;background:none}
nav{display:flex;gap:22px;margin-left:24px}nav a{text-decoration:none;color:var(--mu)}nav a:hover,nav a.on{color:var(--fg)}
.sp{flex:1}.ib{border:0;background:none;padding:8px;position:relative;font-size:14px}.ib b{background:var(--ac);color:var(--ac-t);border-radius:9px;font-size:11px;padding:1px 6px;margin-left:4px}
.menu{display:none}
.sbox{position:relative}.sbox input{border:1px solid var(--ln);background:var(--sf);border-radius:20px;padding:7px 14px;width:200px}
.sug{position:absolute;top:110%;left:0;right:0;min-width:240px;background:var(--bg);border:1px solid var(--ln);z-index:30}
.sug button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px}.sug button:hover{background:var(--sf)}
@media(max-width:800px){nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bg);flex-direction:column;padding:16px 20px;margin:0;border-bottom:1px solid var(--ln)}nav.open{display:flex}.menu{display:block}.sbox input{width:84px;padding:7px 10px}.logo{font-size:19px;letter-spacing:.1em}.hd{gap:6px}.ib{padding:6px 4px;font-size:13px}}
.hero{min-height:78vh;background:linear-gradient(#0d0d0d,#2b2b2b);color:#fff;display:flex;align-items:flex-end;position:relative;overflow:hidden}

@keyframes kb{from{transform:scale(1.07);opacity:.4}}
@media(min-width:800px){.hero .ph{left:42%}.hero .ph::after{background:linear-gradient(90deg,#0d0d0d 0%,#0000 35%)}}
.hero svg{position:absolute;right:-4%;top:6%;height:92%;opacity:.16}
.hero .w{position:relative;padding-bottom:56px;width:100%}
h1{font-weight:900;font-size:clamp(38px,9vw,104px);line-height:.95;margin:0 0 24px;letter-spacing:-.02em;max-width:900px}
h2{font-weight:700;font-size:clamp(24px,4vw,36px);margin:0 0 24px;letter-spacing:-.01em}
.btn{display:inline-block;background:var(--ac);color:var(--ac-t);border:1px solid var(--ac);padding:13px 28px;text-decoration:none;font-weight:500}
.btn.o{background:none;color:var(--fg);border-color:var(--fg)}.hero .btn{background:#fff;color:#0d0d0d;border-color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
section{padding:64px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:28px 20px}}
.card{position:relative}.img{aspect-ratio:4/5;background:var(--sf);display:block;width:100%;border:0;padding:0;overflow:hidden}
.img svg{width:100%;height:100%;transition:transform .4s}.card:hover .img svg{transform:scale(1.04)}
.fv{position:absolute;top:8px;right:8px;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px;font-size:16px}
.tag{position:absolute;top:8px;left:8px;background:var(--ac);color:var(--ac-t);font-size:12px;padding:2px 8px}
.card h3{font-size:15px;font-weight:500;margin:10px 0 2px}.pr b{font-weight:700}.pr s{color:var(--mu);margin-left:8px;font-size:13px}
.dots{display:flex;gap:5px;margin-top:6px}.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--ln);display:inline-block}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(min-width:800px){.cats{grid-template-columns:repeat(5,1fr)}}
.cat{background:var(--sf);aspect-ratio:1;border:0;font-weight:700;font-size:18px;display:flex;align-items:flex-end;padding:16px;text-align:left}
.cat:hover{background:var(--ac);color:var(--ac-t)}
.promo{background:var(--sf)}.promo .w{display:grid;gap:32px;align-items:center}@media(min-width:800px){.promo .w{grid-template-columns:1fr 1fr}}
.adv{display:grid;gap:24px}@media(min-width:800px){.adv{grid-template-columns:repeat(4,1fr)}}.adv p{color:var(--mu);margin:4px 0 0}
.nl{background:var(--ac);color:var(--ac-t)}.nl form{display:flex;gap:8px;flex-wrap:wrap}.nl input{flex:1;min-width:200px;padding:12px;border:1px solid var(--ac-t);background:none;color:var(--ac-t)}
.nl .btn{background:var(--ac-t);color:var(--ac);border-color:var(--ac-t)}
footer{border-top:1px solid var(--ln);padding:48px 0;color:var(--mu)}footer .w{display:grid;gap:28px}@media(min-width:800px){footer .w{grid-template-columns:2fr 1fr 1fr 1fr}}
footer h4{color:var(--fg);margin:0 0 8px}footer a{display:block;text-decoration:none;padding:2px 0}
.cl{display:grid;gap:28px}@media(min-width:800px){.cl{grid-template-columns:230px 1fr}}
.fl label{display:block;margin:14px 0 4px;font-weight:500}.fl select,.fl input[type=number]{width:100%;padding:8px;border:1px solid var(--ln);background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:none;padding:6px 12px;min-width:44px}.chip.on{background:var(--ac);color:var(--ac-t);border-color:var(--ac)}
.pd{display:grid;gap:32px}@media(min-width:800px){.pd{grid-template-columns:1fr 1fr}}
.thumbs{display:flex;gap:8px;margin-top:8px}.thumbs button{width:64px;border:1px solid var(--ln);padding:0;background:var(--sf)}.thumbs .on{border-color:var(--fg)}
.qty{display:inline-flex;border:1px solid var(--ln)}.qty button{border:0;background:none;width:36px;height:36px}.qty span{width:36px;text-align:center;line-height:36px}
.mu{color:var(--mu)}.empty{text-align:center;padding:64px 0;color:var(--mu)}.empty .btn{margin-top:16px}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:50;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;border-left:1px solid var(--ln)}
.dr.open{transform:none}.drh{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ln);font-weight:700}.drb{flex:1;overflow:auto;padding:0 20px}.drf{padding:16px 20px;border-top:1px solid var(--ln)}
.ov{position:fixed;inset:0;background:#0007;z-index:40;display:none}.ov.open{display:block}
.row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}.row .im{width:70px;flex:none;background:var(--sf)}
.ff label{display:block;margin-top:14px;font-weight:500}.ff input,.ff select,.ff textarea{width:100%;padding:10px;border:1px solid var(--ln);background:var(--bg)}
.ff .er{color:var(--err);font-size:13px;min-height:16px}.ff input.bad,.ff textarea.bad{border-color:var(--err)}
.note{background:var(--sf);border-left:3px solid var(--fg);padding:12px 16px;margin-bottom:24px;font-size:14px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}.sc{overflow-x:auto}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ac-t);padding:10px 20px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}.toast.on{opacity:1}
html,body{overflow-x:clip}
@keyframes up{from{transform:translateY(105%);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{40%{transform:scale(1.4)}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes drift{from{opacity:0;transform:translateX(60px)}}
.hero h1 span{display:block;overflow:hidden;padding-bottom:.08em}.hero h1 i{display:block;font-style:normal;animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.hero h1 span:nth-child(2) i{animation-delay:.12s}.hero h1 span:nth-child(3) i{animation-delay:.24s}
.hero svg rect{display:none}.hero .btn{animation:up .8s .55s both}.hero svg{animation:drift 1.6s ease-out both}
.mq{overflow:hidden;border-bottom:1px solid var(--ln);padding:14px 0;white-space:nowrap}.mq div{display:inline-block;animation:mq 30s linear infinite;font-weight:700;font-size:18px}.mq span{margin:0 28px}
.ib b{display:inline-block}.pop{animation:pop .35s}
.btn{transition:transform .15s,opacity .2s}.btn:active{transform:scale(.97)}
.prg{height:4px;background:var(--ln);margin:6px 0 12px}.prg i{display:block;height:100%;background:var(--fg);transition:width .4s}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}

const left=Math.max(0,10000-total());f.innerHTML=`<div class="mu" style="font-size:13px">${left?'До бесплатной доставки: '+rub(left):'Доставка бесплатная'}</div><div class="prg"><i style="width:${Math.min(100,total()/100)}%"></i></div><div style="display:flex;gap:6px;margin-bottom:10px"><input id="pc" placeholder="Промокод" value="${promo}" style="flex:1;padding:8px;border:1px solid var(--ln);background:var(--bg)"><button class="chip" id="pa">Применить</button></div><p style="display:flex;justify-content:space-between"><span>Итого${promo==='VANTA10'?' (−10%)':''}</span><b>${rub(total())}</b></p><a class="btn" style="display:block;text-align:center" href="#checkout" data-close>Оформить заказ</a>`}
const openCart=()=>{$('#dr').classList.add('open');$('#ov').classList.add('open')},closeCart=()=>{$('#dr').classList.remove('open');$('#ov').classList.remove('open')};

app.innerHTML=`<section><div class="w" style="max-width:640px"><h2>Оформление заказа</h2><div class="note">Демо-режим: оплата не подключена, заказ сохраняется только в этом браузере. Для приёма платежей подключите провайдера (см. функцию submitOrder).</div>

<label>Комментарий<textarea name="note" rows="3"></textarea></label><p><b id="ct"></b></p><button class="btn">Подтвердить заказ</button></form></div></section>`;
const f=$('#cf'),ct=()=>{const s=total()>=10000||f.ship.value==='1'?0:500;$('#sm').innerHTML='<div class="note sm"><b>Ваш заказ</b>'+cart.map(i=>{const p=pOf(i.id);return '<div><span>'+esc(p.name)+' · '+COL[i.color][0]+', '+i.size+' ×'+i.qty+'</span><span>'+rub(p.price*i.qty)+'</span></div>'}).join('')+(promo==='VANTA10'?'<div><span>Скидка VANTA10</span><span>−'+rub(sub()-total())+'</span></div>':'')+'<div><span>Доставка</span><span>'+(s?rub(s):'бесплатно')+'</span></div><div><b>Итого</b><b>'+rub(total()+s)+'</b></div></div>';return s};ct();f.ship.onchange=ct;
f.onsubmit=e=>{e.preventDefault();const er={};if(f.name.value.trim().split(/\s+/).length<2)er.name='Укажите имя и фамилию.';if(f.phone.value.replace(/\D/g,'').length<10)er.phone='Телефон — минимум 10 цифр.';if(f.city.value.trim().length<2)er.city='Укажите город.';if(f.addr.value.trim().length<5&&f.ship.value==='0')er.addr='Укажите адрес доставки.';if(f.pay.selectedIndex===1)er.pay=1;
f.querySelectorAll('[data-e]').forEach(d=>{d.textContent=er[d.dataset.e]||''});if(er.pay)return toast('Онлайн-оплата недоступна в демо');if(Object.keys(er).length)return;
submitOrder({name:f.name.value.trim(),phone:f.phone.value.trim(),city:f.city.value.trim(),addr:f.addr.value.trim(),pay:f.pay.value,note:f.note.value.trim(),ship:ct()})}}
function submitOrder(c){/* TODO: заменить на запрос к backend (Supabase) и платёжному провайдеру */
const o={id:'№'+(1000+orders.length+1),date:new Date().toLocaleDateString('ru-RU'),items:cart.map(i=>({...i,name:pOf(i.id).name,price:pOf(i.id).price})),sum:total()+c.ship,status:0,c};
cart.forEach(i=>{pOf(i.id).stock=Math.max(0,pOf(i.id).stock-i.qty)});orders.unshift(o);prof={name:c.name,phone:c.phone,addr:c.addr};cart=[];promo='';S('v_promo','');save();upd();

function account(){app.innerHTML=`<section><div class="w"><h2>Личный кабинет</h2><div class="note">Демо-режим: входа нет, данные хранятся в браузере. Для настоящего аккаунта подключите авторизацию (например, Supabase Auth).</div>

let at='p';function admin(){app.innerHTML=`<section><div class="w"><h2>Администратор</h2><div class="note">Демо-режим без серверной защиты: любой посетитель увидит эту страницу, изменения живут в браузере. В продакшене закройте её авторизацией и серверной проверкой роли (Supabase Auth + RLS).</div>

${at==='p'?`<div class="sc"><table><tr><th>Товар</th><th>Цена</th><th>Старая цена</th><th>Остаток</th><th></th></tr>${prods.map(p=>`<tr><td>${esc(p.name)}<div class="mu">${CATS[p.cat]}</div></td><td><input type="number" data-f="price" data-i="${p.id}" value="${p.price}" style="width:90px"></td><td><input type="number" data-f="old" data-i="${p.id}" value="${p.old||''}" style="width:90px"></td><td><input type="number" data-f="stock" data-i="${p.id}" value="${p.stock}" style="width:70px"></td><td><button class="chip" data-del="${p.id}">Удалить</button></td></tr>`).join('')}</table></div>

:orders.length?`<div class="sc"><table><tr><th>Заказ</th><th>Клиент</th><th>Сумма</th><th>Статус</th></tr>${orders.map((o,i)=>`<tr><td>${o.id}</td><td>${esc(o.c.name)}, ${esc(o.c.phone)}</td><td>${rub(o.sum)}</td><td><select data-os="${i}">${ST.map((s,k)=>`<option value="${k}" ${o.status===k?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`:'<div class="empty">Заказов пока нет.</div>'}</div></section>`;

app.querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>{const p=pOf(i.dataset.i),v=+i.value;p[i.dataset.f]=i.dataset.f==='old'&&!v?null:Math.max(0,v);save();toast('Сохранено')});

const np=$('#np');if(np)np.onsubmit=e=>{e.preventDefault();prods.push({id:'p'+Date.now(),name:np.n.value.trim(),cat:np.c.value,price:+np.p.value,old:null,colors:['black'],sizes:['S','M','L'],stock:10,isNew:1,pop:50,desc:'Новый товар.',sku:'VNT-'+Date.now()%1000});save();admin()}}
